name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-format:
    name: rust-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  rust-check:
    name: rust-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-dev libclang-dev cmake libasound2-dev
          clang_library="$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit)"
          test -n "$clang_library"
          {
            echo "LIBCLANG_PATH=$(dirname "$clang_library")"
            echo "CMAKE=$(command -v cmake)"
            echo "CMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG"
            echo "CMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG"
          } >> "$GITHUB_ENV"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Check workspace
        run: cargo check --workspace

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-dev libclang-dev cmake libasound2-dev
          clang_library="$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit)"
          test -n "$clang_library"
          {
            echo "LIBCLANG_PATH=$(dirname "$clang_library")"
            echo "CMAKE=$(command -v cmake)"
            echo "CMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG"
            echo "CMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG"
          } >> "$GITHUB_ENV"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

  rust-tests:
    name: rust-tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install the locked Playwright browser
        run: cargo run -p deepseek-custom-tests --example install_playwright_chromium
      - name: Run workspace tests
        run: cargo test --workspace -- --test-threads=1

  web-type-check:
    name: web-type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Run TypeScript type-check
        run: npm run typecheck --prefix web

  web-lint:
    name: web-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Run ESLint
        run: npm run lint --prefix web

  web-tests:
    name: web-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Run web tests
        run: npm test --prefix web

  web-build:
    name: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Build web assets
        run: npm run build --prefix web

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Audit web dependencies
        run: npm audit --prefix web --audit-level=high

  github-workflow-syntax:
    name: github-workflow-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint
